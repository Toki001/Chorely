name: chorely
description: Chorely — one home, one team.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  cloud_functions: 7.0.1
  uuid: 4.6.0
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - app/assets/illustrations/invite.png
    - app/assets/illustrations/welcome.png
    - app/assets/illustrations/assign.png
    - app/assets/illustrations/done.png
