name: Verify Chorely
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install pinned Flutter
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/chorely-flutter"
          git -C "$RUNNER_TEMP/chorely-flutter" checkout 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          echo "$RUNNER_TEMP/chorely-flutter/bin" >> "$GITHUB_PATH"
      - name: Install local backend tooling
        run: npm ci --no-fund
      - name: Verify local source and emulators
        run: bash scripts/verify.sh
      - name: Build Android debug app
        run: flutter build apk --debug
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign
